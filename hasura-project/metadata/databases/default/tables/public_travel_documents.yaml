table:
  name: travel_documents
  schema: public
object_relationships:
  - name: itinerary
    using:
      foreign_key_constraint_on: itinerary_id
array_relationships:
  - name: document_files
    using:
      foreign_key_constraint_on:
        column: travel_document_id
        table:
          name: document_files
          schema: public
insert_permissions:
  - role: anonymous
    permission:
      check: {}
      columns: '*'
  - role: group_member
    permission:
      check:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
      columns:
        - itinerary_id
        - title
        - category
        - date
        - reservation_number
        - notes
select_permissions:
  - role: anonymous
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  - role: group_member
    permission:
      columns: '*'
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
update_permissions:
  - role: anonymous
    permission:
      columns: '*'
      filter: {}
      check: null
  - role: group_member
    permission:
      columns:
        - title
        - category
        - date
        - reservation_number
        - notes
        - updated_at
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
      check:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
delete_permissions:
  - role: anonymous
    permission:
      filter: {}
  - role: group_member
    permission:
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
