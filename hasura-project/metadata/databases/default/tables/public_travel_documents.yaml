table:
  name: travel_documents
  schema: public
object_relationships:
  - name: activity
    using:
      foreign_key_constraint_on: activity_id
  - name: itinerary
    using:
      foreign_key_constraint_on: itinerary_id
array_relationships:
  - name: document_files
    using:
      foreign_key_constraint_on:
        column: travel_document_id
        table:
          name: document_files
          schema: public
insert_permissions:
  - role: group_member
    permission:
      check:
        _and:
          - itinerary:
              group_id:
                _eq: X-Hasura-Group-Id
          - _or:
              - activity_id:
                  _is_null: true
              - activity:
                  itinerary_id:
                    _ceq:
                      - $
                      - itinerary_id
      columns:
        - itinerary_id
        - title
        - category
        - date
        - reservation_number
        - notes
        - activity_id
select_permissions:
  - role: group_member
    permission:
      columns: '*'
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
update_permissions:
  - role: group_member
    permission:
      columns:
        - title
        - category
        - date
        - reservation_number
        - notes
        - updated_at
        - activity_id
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
      check:
        _and:
          - itinerary:
              group_id:
                _eq: X-Hasura-Group-Id
          - _or:
              - activity_id:
                  _is_null: true
              - activity:
                  itinerary_id:
                    _ceq:
                      - $
                      - itinerary_id
delete_permissions:
  - role: group_member
    permission:
      filter:
        itinerary:
          group_id:
            _eq: X-Hasura-Group-Id
