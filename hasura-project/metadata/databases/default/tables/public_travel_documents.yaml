table:
  name: travel_documents
  schema: public
object_relationships:
  - name: itinerary
    using:
      foreign_key_constraint_on: itinerary_id
array_relationships:
  - name: document_files
    using:
      foreign_key_constraint_on:
        column: document_id
        table:
          name: document_files
          schema: public
insert_permissions:
  - role: anonymous
    permission:
      check: {}
      columns: '*'
select_permissions:
  - role: anonymous
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
update_permissions:
  - role: anonymous
    permission:
      columns: '*'
      filter: {}
      check: null
delete_permissions:
  - role: anonymous
    permission:
      filter: {}
