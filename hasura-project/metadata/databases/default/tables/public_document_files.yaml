table:
  name: document_files
  schema: public
object_relationships:
  - name: travel_document
    using:
      foreign_key_constraint_on: travel_document_id
insert_permissions:
  - role: group_member
    permission:
      check:
        travel_document:
          itinerary:
            group_id:
              _eq: X-Hasura-Group-Id
      columns:
        - travel_document_id
        - file_url
        - file_type
        - file_name
        - file_size
        - mime_type
        - cloudinary_public_id
        - display_order
select_permissions:
  - role: group_member
    permission:
      columns: '*'
      filter:
        travel_document:
          itinerary:
            group_id:
              _eq: X-Hasura-Group-Id
delete_permissions:
  - role: group_member
    permission:
      filter:
        travel_document:
          itinerary:
            group_id:
              _eq: X-Hasura-Group-Id
