table:
  name: itineraries
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: user
    using:
      foreign_key_constraint_on: created_by
array_relationships:
  - name: activities
    using:
      foreign_key_constraint_on:
        column: itinerary_id
        table:
          name: activities
          schema: public
  - name: budgets
    using:
      foreign_key_constraint_on:
        column: itinerary_id
        table:
          name: budgets
          schema: public
  - name: travel_documents
    using:
      foreign_key_constraint_on:
        column: itinerary_id
        table:
          name: travel_documents
          schema: public
select_permissions:
  - role: group_member
    permission:
      columns: '*'
      filter:
        group_id:
          _eq: X-Hasura-Group-Id
update_permissions:
  - role: group_member
    permission:
      columns:
        - title
        - destination
        - start_date
        - end_date
        - travel_purpose
        - location_type
        - total_budget
      filter:
        group_id:
          _eq: X-Hasura-Group-Id
      check:
        group_id:
          _eq: X-Hasura-Group-Id
