<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="空港">
  <defs><clipPath id="ap-frame"><rect width="800" height="360"/></clipPath></defs>
  <g clip-path="url(#ap-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#DDEBFD"/>

    <!-- 太陽 -->
    <circle class="tn-pulse" cx="664" cy="92" r="58" fill="#FFE29A" opacity="0.3"/>
    <circle cx="664" cy="92" r="32" fill="#FFD66B"/>

    <!-- 雲 -->
    <g class="tn-drift" fill="#FFFFFF" opacity="0.9">
      <circle cx="116" cy="96" r="26"/><circle cx="148" cy="84" r="34"/><circle cx="184" cy="98" r="24"/>
      <rect x="92" y="96" width="116" height="26" rx="13"/>
    </g>
    <g class="tn-drift-slow" fill="#FFFFFF" opacity="0.7">
      <circle cx="532" cy="196" r="18"/><circle cx="556" cy="186" r="24"/><circle cx="582" cy="198" r="16"/>
      <rect x="516" y="196" width="82" height="18" rx="9"/>
    </g>

    <!-- 管制塔 -->
    <g>
      <rect x="680" y="176" width="28" height="118" fill="#9CBEEA"/>
      <path d="M664 150 H724 L716 184 H672 Z" fill="#7FA8E0"/>
      <rect x="670" y="158" width="48" height="14" rx="4" fill="#E9F3FF"/>
      <rect x="690" y="130" width="8" height="20" fill="#7FA8E0"/>
    </g>

    <!-- 滑走路 -->
    <path d="M0 290 C 200 282 420 294 600 288 C 700 284 760 290 800 288 L800 360 L0 360 Z" fill="#A9C6EE"/>
    <path d="M0 320 L800 312 L800 360 L0 360 Z" fill="#8FB2E6"/>
    <g fill="#FFFFFF" opacity="0.8">
      <rect x="40" y="330" width="60" height="8" rx="4"/><rect x="170" y="328" width="60" height="8" rx="4"/>
      <rect x="300" y="326" width="60" height="8" rx="4"/><rect x="430" y="324" width="60" height="8" rx="4"/>
      <rect x="560" y="322" width="60" height="8" rx="4"/><rect x="690" y="320" width="60" height="8" rx="4"/>
    </g>

    <!-- 飛行機雲 -->
    <g class="tn-speed" fill="#FFFFFF" opacity="0.8">
      <rect x="120" y="176" width="110" height="8" rx="4"/>
      <rect x="150" y="198" width="80" height="8" rx="4"/>
    </g>

    <!-- 飛行機 -->
    <g class="tn-bob">
      <g transform="rotate(-8 420 190)">
        <path d="M298 168 H540 C 578 168 604 180 604 192 C 604 204 578 216 540 216 H298 C 280 216 268 206 268 192 C 268 178 280 168 298 168 Z" fill="#FFFDF6"/>
        <path d="M268 192 L252 132 H286 L322 170 Z" fill="#3B82F6"/>
        <path d="M400 204 L346 268 H386 L468 204 Z" fill="#5B9BF8"/>
        <path d="M410 176 L380 140 H408 L454 176 Z" fill="#8DB9FA"/>
        <path d="M560 172 C 584 174 598 182 600 190 H566 Z" fill="#5B9BF8"/>
        <g fill="#5B9BF8">
          <circle cx="340" cy="190" r="6"/><circle cx="366" cy="190" r="6"/><circle cx="392" cy="190" r="6"/>
          <circle cx="418" cy="190" r="6"/><circle cx="444" cy="190" r="6"/><circle cx="470" cy="190" r="6"/><circle cx="496" cy="190" r="6"/>
        </g>
        <rect x="268" y="204" width="336" height="6" fill="#3B82F6" opacity="0.35"/>
      </g>
    </g>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#8FB2E6"/>
  </g>
</svg>
