<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="エリア">
  <style>
    @keyframes tn-drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(24px) } }
    @keyframes tn-bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes tn-pulse { 0%,100% { transform: scale(1); opacity: .28 } 50% { transform: scale(1.09); opacity: .42 } }
    @keyframes tn-twinkle { 0%,100% { opacity: .35 } 50% { opacity: .95 } }
    .tn-drift { animation: tn-drift 26s ease-in-out infinite }
    .tn-drift-slow { animation: tn-drift 38s ease-in-out infinite reverse }
    .tn-bob { animation: tn-bob 4s ease-in-out infinite }
    .tn-pulse { transform-box: fill-box; transform-origin: center; animation: tn-pulse 5s ease-in-out infinite }
    .tn-twinkle { animation: tn-twinkle 3.2s ease-in-out infinite }
    @keyframes tn-drop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes tn-shadow { 0%,100% { transform: scale(1); opacity: .25 } 50% { transform: scale(.84); opacity: .16 } }
    .tn-drop { animation: tn-drop 3.4s ease-in-out infinite }
    .tn-shadow { transform-box: fill-box; transform-origin: center; animation: tn-shadow 3.4s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) {
      .tn-drift, .tn-drift-slow, .tn-bob, .tn-pulse, .tn-twinkle,
      .tn-speed, .tn-steam, .tn-float, .tn-drop, .tn-shadow { animation: none }
    }
  </style>
  <defs>
    <clipPath id="ar-frame"><rect width="800" height="360"/></clipPath>
    <clipPath id="ar-map">
      <path d="M120 96 L300 128 L500 96 L680 128 L680 284 L500 252 L300 284 L120 252 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ar-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#ECEFF8"/>
    <circle cx="106" cy="72" r="52" fill="#DCE1F0" opacity="0.9"/>
    <circle cx="768" cy="336" r="68" fill="#DCE1F0" opacity="0.8"/>

    <!-- 地図 -->
    <g>
      <path d="M120 96 L300 128 L500 96 L680 128 L680 284 L500 252 L300 284 L120 252 Z" fill="#FFFDF6"/>
      <g clip-path="url(#ar-map)">
        <!-- 区画 -->
        <g fill="#B9E3C4">
          <rect x="140" y="140" width="96" height="60" rx="14"/>
          <rect x="520" y="164" width="120" height="72" rx="16"/>
        </g>
        <g fill="#C8D3EC">
          <rect x="320" y="132" width="70" height="44" rx="10"/>
          <rect x="248" y="206" width="58" height="46" rx="10"/>
          <rect x="430" y="200" width="66" height="52" rx="10"/>
        </g>
        <!-- 川 -->
        <path d="M120 232 C 210 206 250 254 340 244 C 430 234 470 268 560 258 C 640 250 660 268 700 262" stroke="#A8C6EE" stroke-width="18" fill="none" stroke-linecap="round"/>
        <!-- 道路 -->
        <path d="M108 190 C 220 168 300 214 400 206 C 510 196 580 150 700 168" stroke="#98A5C4" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M108 190 C 220 168 300 214 400 206 C 510 196 580 150 700 168" stroke="#FFFDF6" stroke-width="4" fill="none" stroke-dasharray="14 14" stroke-linecap="round"/>
      </g>
      <!-- 折り目 -->
      <g stroke="#DFE4F1" stroke-width="4" fill="none">
        <path d="M300 128 L300 284"/><path d="M500 96 L500 252"/>
      </g>
      <path d="M120 96 L300 128 L500 96 L680 128 L680 284 L500 252 L300 284 L120 252 Z" fill="none" stroke="#DFE4F1" stroke-width="5"/>
    </g>

    <!-- ピン -->
    <ellipse class="tn-shadow" cx="400" cy="272" rx="46" ry="12" fill="#6B7280" opacity="0.25"/>
    <g class="tn-drop"><path d="M400 96 C 360 96 328 128 328 168 C 328 214 400 268 400 268 C 400 268 472 214 472 168 C 472 128 440 96 400 96 Z" fill="#6366F1"/>
    <circle cx="400" cy="166" r="26" fill="#FFFDF6"/></g>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#ECEFF8"/>
  </g>
</svg>
