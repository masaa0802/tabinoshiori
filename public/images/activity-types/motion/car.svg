<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="ドライブ">
  <style>
    @keyframes tn-drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(34px) } }
    @keyframes tn-bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @keyframes tn-bob-sm { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes tn-pulse { 0%,100% { transform: scale(1); opacity: .26 } 50% { transform: scale(1.18); opacity: .52 } }
    @keyframes tn-breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes tn-twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .tn-drift { animation: tn-drift 18s ease-in-out infinite }
    .tn-drift-slow { animation: tn-drift 26s ease-in-out infinite reverse }
    .tn-bob { animation: tn-bob 3s ease-in-out infinite }
    .tn-bob-sm { animation: tn-bob-sm 2.4s ease-in-out infinite }
    .tn-bob-slow { animation: tn-bob 4.4s ease-in-out infinite }
    .tn-pulse { transform-box: fill-box; transform-origin: center; animation: tn-pulse 3.6s ease-in-out infinite }
    .tn-breathe { transform-box: fill-box; transform-origin: center; animation: tn-breathe 4s ease-in-out infinite }
    .tn-twinkle { animation: tn-twinkle 2.2s ease-in-out infinite }
    @keyframes tn-speed { 0% { transform: translateX(56px); opacity: 0 } 20% { opacity: .9 } 100% { transform: translateX(-80px); opacity: 0 } }
    @keyframes tn-rail { to { transform: translateX(-48px) } }
    .tn-speed { animation: tn-speed 1.3s linear infinite }
    .tn-rail { animation: tn-rail 0.7s linear infinite }
    @keyframes tn-steam { 0% { transform: translateY(14px); opacity: 0 } 22% { opacity: .95 } 100% { transform: translateY(-38px); opacity: 0 } }
    .tn-steam { animation: tn-steam 2.4s ease-out infinite }
    .tn-steam-2 { animation-delay: .8s } .tn-steam-3 { animation-delay: 1.6s }
    @keyframes tn-float { 0%,100% { transform: translateY(0) rotate(-1.8deg) } 50% { transform: translateY(-18px) rotate(1.8deg) } }
    .tn-float { transform-box: fill-box; transform-origin: 400px 300px; animation: tn-float 4.6s ease-in-out infinite }
    @keyframes tn-road { to { transform: translateX(-96px) } }
    .tn-road { animation: tn-road 0.9s linear infinite }
    @media (prefers-reduced-motion: reduce) {
      .tn-drift, .tn-drift-slow, .tn-bob, .tn-bob-sm, .tn-bob-slow, .tn-pulse, .tn-breathe,
      .tn-twinkle, .tn-speed, .tn-rail, .tn-steam, .tn-float, .tn-drop, .tn-shadow,
      .tn-route, .tn-road { animation: none }
    }
  </style>
  <defs><clipPath id="cr-frame"><rect width="800" height="360"/></clipPath></defs>
  <g clip-path="url(#cr-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#E3F0FC"/>

    <!-- 太陽 -->
    <circle class="tn-pulse" cx="656" cy="88" r="56" fill="#FFE29A" opacity="0.3"/>
    <circle cx="656" cy="88" r="30" fill="#FFD66B"/>

    <!-- 雲 -->
    <g class="tn-drift" fill="#FFFFFF" opacity="0.9">
      <circle cx="140" cy="84" r="22"/><circle cx="168" cy="74" r="30"/><circle cx="200" cy="86" r="20"/>
      <rect x="120" y="84" width="100" height="22" rx="11"/>
    </g>

    <!-- 山並み -->
    <path d="M0 250 L120 150 L220 230 L340 120 L480 250 Z" fill="#B7D3EF"/>
    <path d="M300 250 L470 138 L620 250 Z" fill="#A5C6EA"/>
    <path d="M540 250 L680 170 L800 240 L800 250 Z" fill="#B7D3EF"/>
    <path d="M340 120 L316 142 L332 140 L346 150 L362 138 Z" fill="#FFFFFF"/>
    <path d="M470 138 L448 152 L464 152 L476 160 L490 150 Z" fill="#FFFFFF"/>

    <!-- 草地 -->
    <path d="M0 246 C 200 236 400 252 600 244 C 700 240 760 246 800 244 L800 300 L0 300 Z" fill="#BFE3C8"/>

    <!-- 道路 -->
    <path d="M0 286 L800 278 L800 360 L0 360 Z" fill="#A7B8CC"/>
    <path d="M0 322 L800 316 L800 360 L0 360 Z" fill="#91A4BA"/>
    <g class="tn-road" fill="#FFFFFF" opacity="0.85">
      <rect x="0" y="303" width="36" height="6" rx="3"/><rect x="96" y="302" width="36" height="6" rx="3"/>
      <rect x="192" y="301" width="36" height="6" rx="3"/><rect x="288" y="300" width="36" height="6" rx="3"/>
      <rect x="384" y="299" width="36" height="6" rx="3"/><rect x="480" y="298" width="36" height="6" rx="3"/>
      <rect x="576" y="297" width="36" height="6" rx="3"/><rect x="672" y="296" width="36" height="6" rx="3"/>
      <rect x="768" y="295" width="36" height="6" rx="3"/><rect x="864" y="294" width="36" height="6" rx="3"/>
    </g>

    <!-- 車 -->
    <g class="tn-bob-sm">
      <path d="M262 214 L318 158 C 326 150 336 146 348 146 H468 C 482 146 494 152 502 162 L546 214 Z" fill="#3B82F6"/>
      <path d="M336 166 C 340 162 344 160 350 160 H410 V212 H292 Z" fill="#DDEEFF"/>
      <path d="M424 160 H464 C 472 160 480 164 486 170 L522 212 H424 Z" fill="#DDEEFF"/>
      <rect x="226" y="206" width="352" height="64" rx="26" fill="#4C8FF7"/>
      <rect x="560" y="222" width="16" height="16" rx="5" fill="#FFD66B"/>
      <rect x="228" y="224" width="12" height="14" rx="4" fill="#EF6F5E"/>
      <rect x="300" y="138" width="200" height="10" rx="5" fill="#2E3A4F"/>
      <rect x="330" y="116" width="120" height="22" rx="8" fill="#F5B94E"/>
      <circle cx="310" cy="270" r="30" fill="#2E3A4F"/><circle cx="310" cy="270" r="12" fill="#C9D4E2"/>
      <circle cx="500" cy="270" r="30" fill="#2E3A4F"/><circle cx="500" cy="270" r="12" fill="#C9D4E2"/>
    </g>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#91A4BA"/>
  </g>
</svg>
