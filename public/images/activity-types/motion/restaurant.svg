<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="飲食店">
  <style>
    @keyframes tn-drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(34px) } }
    @keyframes tn-bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @keyframes tn-bob-sm { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes tn-pulse { 0%,100% { transform: scale(1); opacity: .26 } 50% { transform: scale(1.18); opacity: .52 } }
    @keyframes tn-breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes tn-twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .tn-drift { animation: tn-drift 18s ease-in-out infinite }
    .tn-drift-slow { animation: tn-drift 26s ease-in-out infinite reverse }
    .tn-bob { animation: tn-bob 3s ease-in-out infinite }
    .tn-bob-sm { animation: tn-bob-sm 2.4s ease-in-out infinite }
    .tn-bob-slow { animation: tn-bob 4.4s ease-in-out infinite }
    .tn-pulse { transform-box: fill-box; transform-origin: center; animation: tn-pulse 3.6s ease-in-out infinite }
    .tn-breathe { transform-box: fill-box; transform-origin: center; animation: tn-breathe 4s ease-in-out infinite }
    .tn-twinkle { animation: tn-twinkle 2.2s ease-in-out infinite }
    @keyframes tn-steam { 0% { transform: translateY(14px); opacity: 0 } 22% { opacity: .95 } 100% { transform: translateY(-38px); opacity: 0 } }
    .tn-steam { animation: tn-steam 2.4s ease-out infinite }
    .tn-steam-2 { animation-delay: .8s } .tn-steam-3 { animation-delay: 1.6s }
    @media (prefers-reduced-motion: reduce) {
      .tn-drift, .tn-drift-slow, .tn-bob, .tn-bob-sm, .tn-bob-slow, .tn-pulse, .tn-breathe,
      .tn-twinkle, .tn-speed, .tn-rail, .tn-steam, .tn-float, .tn-drop, .tn-shadow,
      .tn-route, .tn-road { animation: none }
    }
  </style>
  <defs><clipPath id="rs-frame"><rect width="800" height="360"/></clipPath></defs>
  <g clip-path="url(#rs-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#FFEFD9"/>

    <!-- 壁の飾り -->
    <circle cx="112" cy="84" r="46" fill="#FFDCAF" opacity="0.8"/>
    <circle cx="690" cy="66" r="62" fill="#FFDCAF" opacity="0.6"/>

    <!-- 湯気 -->
    <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9">
      <path class="tn-steam" d="M360 104 C 344 84 376 72 360 50"/>
      <path class="tn-steam tn-steam-2" d="M408 92 C 392 70 424 58 408 34"/>
      <path class="tn-steam tn-steam-3" d="M456 106 C 440 86 472 74 456 52"/>
    </g>

    <!-- テーブル -->
    <path d="M0 290 C 170 278 320 296 470 290 C 610 284 700 296 800 288 L800 360 L0 360 Z" fill="#F0A85C"/>
    <path d="M0 322 C 190 312 330 328 490 320 C 620 314 710 324 800 318 L800 360 L0 360 Z" fill="#DE9046"/>

    <!-- 皿 -->
    <ellipse cx="408" cy="304" rx="140" ry="16" fill="#C97F3C" opacity="0.3"/>
    <g class="tn-bob-slow"><circle cx="408" cy="212" r="104" fill="#FFFDF6"/>
    <circle cx="408" cy="212" r="80" fill="none" stroke="#FFE6C4" stroke-width="8"/>
    <circle cx="408" cy="212" r="56" fill="#FFCE93"/>
    <circle cx="392" cy="200" r="20" fill="#EF8163"/>
    <path d="M420 234 C 444 222 452 240 436 250 C 424 258 412 248 420 234 Z" fill="#79C47F"/>
    <path d="M430 196 C 448 186 462 198 452 210 C 444 220 424 210 430 196 Z" fill="#8FD094"/></g>

    <!-- フォーク -->
    <g fill="#E29A4E">
      <rect x="250" y="182" width="16" height="122" rx="8"/>
      <rect x="234" y="120" width="10" height="54" rx="5"/>
      <rect x="253" y="120" width="10" height="54" rx="5"/>
      <rect x="272" y="120" width="10" height="54" rx="5"/>
      <path d="M234 166 H282 C282 186 270 198 258 198 C246 198 234 186 234 166 Z"/>
    </g>

    <!-- ナイフ -->
    <g fill="#E29A4E">
      <rect x="540" y="192" width="16" height="112" rx="8"/>
      <path d="M540 120 C 562 132 572 152 572 178 C 572 192 564 202 552 204 L540 204 Z"/>
    </g>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#DE9046"/>
  </g>
</svg>
