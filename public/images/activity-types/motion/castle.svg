<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="お城">
  <style>
    @keyframes tn-drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(34px) } }
    @keyframes tn-bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @keyframes tn-bob-sm { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes tn-pulse { 0%,100% { transform: scale(1); opacity: .26 } 50% { transform: scale(1.18); opacity: .52 } }
    @keyframes tn-breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
    @keyframes tn-twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .tn-drift { animation: tn-drift 18s ease-in-out infinite }
    .tn-drift-slow { animation: tn-drift 26s ease-in-out infinite reverse }
    .tn-bob { animation: tn-bob 3s ease-in-out infinite }
    .tn-bob-sm { animation: tn-bob-sm 2.4s ease-in-out infinite }
    .tn-bob-slow { animation: tn-bob 4.4s ease-in-out infinite }
    .tn-pulse { transform-box: fill-box; transform-origin: center; animation: tn-pulse 3.6s ease-in-out infinite }
    .tn-breathe { transform-box: fill-box; transform-origin: center; animation: tn-breathe 4s ease-in-out infinite }
    .tn-twinkle { animation: tn-twinkle 2.2s ease-in-out infinite }
    @keyframes tn-speed { 0% { transform: translateX(56px); opacity: 0 } 20% { opacity: .9 } 100% { transform: translateX(-80px); opacity: 0 } }
    @keyframes tn-rail { to { transform: translateX(-48px) } }
    .tn-speed { animation: tn-speed 1.3s linear infinite }
    .tn-rail { animation: tn-rail 0.7s linear infinite }
    @keyframes tn-steam { 0% { transform: translateY(14px); opacity: 0 } 22% { opacity: .95 } 100% { transform: translateY(-38px); opacity: 0 } }
    .tn-steam { animation: tn-steam 2.4s ease-out infinite }
    .tn-steam-2 { animation-delay: .8s } .tn-steam-3 { animation-delay: 1.6s }
    @keyframes tn-float { 0%,100% { transform: translateY(0) rotate(-1.8deg) } 50% { transform: translateY(-18px) rotate(1.8deg) } }
    .tn-float { transform-box: fill-box; transform-origin: 400px 300px; animation: tn-float 4.6s ease-in-out infinite }
    @keyframes tn-road { to { transform: translateX(-96px) } }
    .tn-road { animation: tn-road 0.9s linear infinite }
    @media (prefers-reduced-motion: reduce) {
      .tn-drift, .tn-drift-slow, .tn-bob, .tn-bob-sm, .tn-bob-slow, .tn-pulse, .tn-breathe,
      .tn-twinkle, .tn-speed, .tn-rail, .tn-steam, .tn-float, .tn-drop, .tn-shadow,
      .tn-route, .tn-road { animation: none }
    }
  </style>
  <defs><clipPath id="cs-frame"><rect width="800" height="360"/></clipPath></defs>
  <g clip-path="url(#cs-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#E3EEF8"/>
    <circle class="tn-pulse" cx="660" cy="80" r="54" fill="#FFE29A" opacity="0.28"/>
    <circle cx="660" cy="80" r="28" fill="#FFD66B"/>
    <g class="tn-drift" fill="#FFFFFF" opacity="0.9">
      <circle cx="110" cy="96" r="24"/><circle cx="140" cy="84" r="32"/><circle cx="174" cy="98" r="22"/>
      <rect x="88" y="96" width="108" height="24" rx="12"/>
    </g>
    <!-- 桜 -->
    <g>
      <rect x="126" y="210" width="12" height="80" fill="#8A6A52"/>
      <circle cx="132" cy="200" r="40" fill="#F9C9D6"/><circle cx="104" cy="220" r="28" fill="#F7B6C8"/><circle cx="160" cy="222" r="28" fill="#FBD7E1"/>
      <rect x="664" y="214" width="12" height="76" fill="#8A6A52"/>
      <circle cx="670" cy="204" r="38" fill="#F9C9D6"/><circle cx="696" cy="226" r="26" fill="#F7B6C8"/><circle cx="644" cy="226" r="26" fill="#FBD7E1"/>
    </g>
    <path d="M0 288 C 180 278 360 294 540 286 C 660 280 740 290 800 286 L800 360 L0 360 Z" fill="#B5D6A8"/>
    <path d="M0 322 C 200 312 380 328 560 320 C 680 314 750 322 800 318 L800 360 L0 360 Z" fill="#9BC68C"/>

    <!-- 石垣 -->
    <path d="M280 290 L300 222 H500 L520 290 Z" fill="#B6ADA3"/>
    <g stroke="#9E958B" stroke-width="3" fill="none">
      <path d="M296 240 H504"/><path d="M290 258 H510"/><path d="M286 274 H514"/>
      <path d="M340 222 V240 M400 222 V240 M460 222 V240 M370 240 V258 M430 240 V258 M340 258 V274 M400 258 V274 M460 258 V274"/>
    </g>
    <!-- 天守 -->
    <g>
      <rect x="318" y="182" width="164" height="40" fill="#FFFDF6"/>
      <path d="M296 186 L400 160 L504 186 L496 194 H304 Z" fill="#3E5064"/>
      <rect x="340" y="136" width="120" height="30" fill="#FFFDF6"/>
      <path d="M318 140 L400 116 L482 140 L474 148 H326 Z" fill="#3E5064"/>
      <path d="M372 132 L400 118 L428 132 Z" fill="#3E5064"/>
      <rect x="362" y="96" width="76" height="26" fill="#FFFDF6"/>
      <path d="M346 100 L400 76 L454 100 L446 106 H354 Z" fill="#3E5064"/>
      <g fill="#C9A24A"><path d="M346 100 L336 88 L352 96 Z"/><path d="M454 100 L464 88 L448 96 Z"/></g>
      <g fill="#3E5064">
        <rect x="340" y="196" width="16" height="14"/><rect x="372" y="196" width="16" height="14"/><rect x="412" y="196" width="16" height="14"/><rect x="444" y="196" width="16" height="14"/>
        <rect x="358" y="146" width="14" height="12"/><rect x="393" y="146" width="14" height="12"/><rect x="428" y="146" width="14" height="12"/>
        <rect x="380" y="104" width="12" height="12"/><rect x="408" y="104" width="12" height="12"/>
      </g>
    </g>
    <!-- 花びら -->
    <g class="tn-drift" fill="#F7B6C8">
      <ellipse cx="220" cy="140" rx="6" ry="4"/><ellipse cx="560" cy="180" rx="6" ry="4"/><ellipse cx="250" cy="220" rx="5" ry="3"/>
    </g>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#9BC68C"/>
  </g>
</svg>
