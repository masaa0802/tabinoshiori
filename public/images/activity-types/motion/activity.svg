<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="アクティビティ">
  <style>
    @keyframes tn-drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(24px) } }
    @keyframes tn-bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes tn-pulse { 0%,100% { transform: scale(1); opacity: .28 } 50% { transform: scale(1.09); opacity: .42 } }
    @keyframes tn-twinkle { 0%,100% { opacity: .35 } 50% { opacity: .95 } }
    .tn-drift { animation: tn-drift 26s ease-in-out infinite }
    .tn-drift-slow { animation: tn-drift 38s ease-in-out infinite reverse }
    .tn-bob { animation: tn-bob 4s ease-in-out infinite }
    .tn-pulse { transform-box: fill-box; transform-origin: center; animation: tn-pulse 5s ease-in-out infinite }
    .tn-twinkle { animation: tn-twinkle 3.2s ease-in-out infinite }
    @keyframes tn-float { 0%,100% { transform: translateY(0) rotate(-.6deg) } 50% { transform: translateY(-9px) rotate(.6deg) } }
    .tn-float { transform-box: fill-box; transform-origin: 400px 300px; animation: tn-float 6s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) {
      .tn-drift, .tn-drift-slow, .tn-bob, .tn-pulse, .tn-twinkle,
      .tn-speed, .tn-steam, .tn-float, .tn-drop, .tn-shadow { animation: none }
    }
  </style>
  <defs>
    <clipPath id="ac-frame"><rect width="800" height="360"/></clipPath>
    <clipPath id="ac-balloon">
      <path d="M400 30 C 306 30 248 92 248 146 C 248 200 330 236 400 268 C 470 236 552 200 552 146 C 552 92 494 30 400 30 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ac-frame)">
    <g transform="translate(0,-26)">
    <rect width="800" height="360" fill="#FFE7E1"/>

    <!-- 雲 -->
    <g class="tn-drift" fill="#FFFFFF" opacity="0.9">
      <circle cx="122" cy="92" r="24"/><circle cx="158" cy="80" r="32"/><circle cx="196" cy="94" r="22"/>
      <rect x="114" y="94" width="94" height="26" rx="13"/>
    </g>
    <g class="tn-drift-slow" fill="#FFFFFF" opacity="0.7">
      <circle cx="628" cy="76" r="20"/><circle cx="660" cy="66" r="27"/><circle cx="692" cy="78" r="18"/>
      <rect x="622" y="78" width="80" height="22" rx="11"/>
    </g>

    <!-- 鳥 -->
    <g stroke="#F4796B" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M96 190 C 108 178 118 178 128 190"/>
      <path d="M128 190 C 138 178 148 178 160 190"/>
    </g>

    <!-- 気球 -->
    <g class="tn-float">
      <path d="M400 30 C 306 30 248 92 248 146 C 248 200 330 236 400 268 C 470 236 552 200 552 146 C 552 92 494 30 400 30 Z" fill="#F4796B"/>
      <g clip-path="url(#ac-balloon)">
        <rect x="372" y="20" width="56" height="260" fill="#FFF3E6"/>
        <rect x="300" y="20" width="30" height="260" fill="#E8574A"/>
        <rect x="470" y="20" width="30" height="260" fill="#E8574A"/>
        <rect x="248" y="20" width="304" height="18" fill="#FFF3E6" opacity="0.5"/>
      </g>
      <path d="M360 240 H440 L430 262 H370 Z" fill="#E8574A"/>
      <g stroke="#C98A4B" stroke-width="5" stroke-linecap="round">
        <path d="M368 258 L378 292"/><path d="M432 258 L422 292"/>
      </g>
      <rect x="370" y="290" width="60" height="38" rx="12" fill="#D79A5C"/>
      <rect x="370" y="300" width="60" height="8" fill="#C08744"/>
    </g>

    <!-- 丘 -->
    <path d="M0 302 C 120 278 210 312 320 308 C 440 303 520 282 640 296 C 710 304 760 314 800 306 L800 360 L0 360 Z" fill="#F6A99A"/>
    <path d="M0 330 C 160 318 300 338 470 330 C 610 323 700 336 800 330 L800 360 L0 360 Z" fill="#EE8878"/>
  </g>
    <rect x="0" y="334" width="800" height="26" fill="#EE8878"/>
  </g>
</svg>
